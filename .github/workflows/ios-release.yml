name: iOS production build (free runner)

# Same pipeline that shipped Anker 1.0.0 and Scripture Mate 1.3.0:
# eas build --local on a GitHub macOS runner — outside any EAS hosted quota.
#
# Hard-learned rules baked in:
#   - macos-26: Apple rejects binaries not built with the iOS 26 SDK
#     (ITMS-90725), and SDK 57 needs Swift tools 6.2 anyway.
#   - Xcode version asserted up front: fail in seconds, not after 40 min.
#   - EAS working dir preserved on failure so the real xcodebuild log
#     survives; empty log artifacts are a hard error.
#
# One-time prerequisites before the first run:
#   - EXPO_TOKEN repository secret
#   - EAS project created (npx eas-cli init) and app record in ASC
#   - one interactive `eas build` to mint signing for app.vela.manifest

on:
  push:
    branches:
      - review-rebuild
  workflow_dispatch:
    inputs:
      submit:
        description: "Upload to App Store Connect after building"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.VELA_EXPO_TOKEN }}
      EAS_SKIP_AUTO_FINGERPRINT: "1"
      EAS_BUILD_NO_EXPO_GO_WARNING: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode is new enough to upload
        run: |
          xcodebuild -version
          MAJOR=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::Xcode $MAJOR too old; App Store uploads require the iOS 26 SDK (Xcode 26+)."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify the lockfile matches package.json
        run: npm ci --include=dev

      - name: Tests and typecheck
        run: |
          npx --yes bun@1.3.14 test
          npx tsc --noEmit

      - name: Validate the store listing against Apple's limits
        run: python3 scripts/check_metadata.py

      - name: Build signed IPA
        env:
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/easbuild
          EAS_LOCAL_BUILD_SKIP_CLEANUP: "1"
        run: |
          npx eas-cli@latest build \
            --platform ios \
            --profile production \
            --local \
            --non-interactive \
            --output "$RUNNER_TEMP/vela.ipa"

      - name: Collect Xcode logs on failure
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/xcodelogs"
          for root in "$RUNNER_TEMP/easbuild" "${TMPDIR:-/tmp}"; do
            [ -d "$root" ] || continue
            find "$root" \( -name '*.log' -o -path '*/logs/*' \) -type f -size -20M \
              -exec cp {} "$RUNNER_TEMP/xcodelogs/" \; 2>/dev/null || true
          done
          ls -la "$RUNNER_TEMP/xcodelogs" || true

      - name: Upload Xcode logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-logs
          path: ${{ runner.temp }}/xcodelogs
          retention-days: 7
          if-no-files-found: error

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: vela-ios-ipa
          path: ${{ runner.temp }}/vela.ipa
          retention-days: 14

      - name: Upload to App Store Connect
        if: ${{ inputs.submit }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then
            echo "ASC_* secrets not set — skipping upload; download the artifact instead."
            exit 0
          fi
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/vela.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
