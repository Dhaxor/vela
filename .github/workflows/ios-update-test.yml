name: iOS simulator tests (fresh 1.1 + update 1.0.1 -> 1.1)

# Two real-simulator proofs of Vela 1.1, from simulator Release builds:
#
#   build          Vela 1.0.1 (15c43a7, what users have) and Vela 1.1
#                  (elevate-1.1 HEAD) as simulator Release .apps, in parallel.
#   fresh-install  1.1 alone, on TWO iPhones (16 Pro Max 440x956 and the
#                  smallest iPhone the iOS 26 runtime has): the App Review path
#                  of store/REVIEW_NOTES_1.1.md with typing at every field, each
#                  field checked to stay inside its scroll view, above the
#                  keyboard and above the dock while typing (e2e/fresh-install.mjs).
#   update-test    install 1.0.1, drive it like a long-time user, seed what a
#                  LIFETIME owner's device also holds, install 1.1 over it and
#                  assert everything survived and every 1.1 flow works on the
#                  migrated data (e2e/update-test.mjs).
#   publish        every job's screenshots, page sources, results JSON, device
#                  logs (crash reports and JS errors checked by e2e/logcheck.mjs)
#                  go to the orphan branch ios-update-results: update/,
#                  fresh-promax/, fresh-small/.
#
# Iterating on the tests only: set REUSE_BUILDS_FROM_RUN to a run id whose
# vela-app-* artifacts are still alive and the build jobs are skipped.

on:
  push:
    branches: [ios-update-test]
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: Reuse the .app artifacts of this run id (skip both builds)
        required: false
        default: ""

concurrency:
  group: ios-update-test
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  BUNDLE_ID: app.vela.manifest
  REUSE_BUILDS_FROM_RUN: ""

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      reuse: ${{ steps.p.outputs.reuse }}
    steps:
      - id: p
        run: echo "reuse=${{ inputs.reuse_run_id || env.REUSE_BUILDS_FROM_RUN }}" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.label }}
    needs: plan
    if: needs.plan.outputs.reuse == ''
    runs-on: macos-26
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: v101
            ref: 15c43a7952208fa8bf2c9e26859bebbe38271251
          - label: v11
            ref: elevate-1.1
    steps:
      - name: Checkout ${{ matrix.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Toolchain
        run: |
          xcodebuild -version
          MAJOR=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          [ "$MAJOR" -ge 26 ] || { echo "::error::Xcode $MAJOR; SDK 57 needs Xcode 26 (Swift 6.2)"; exit 1; }
          pod --version
          node --version
          (cd src && git log -1 --format='%H %s')

      - name: npm ci
        working-directory: src
        run: npm ci --include=dev

      - name: expo prebuild
        working-directory: src
        run: npx expo prebuild -p ios --no-install

      - name: pod install
        working-directory: src/ios
        run: pod install

      - name: xcodebuild (Release, iphonesimulator)
        working-directory: src
        run: |
          set -o pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace=$WS scheme=$SCHEME"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build > xcodebuild.log 2>&1 || {
              grep -E "error:|fatal|\*\* BUILD" xcodebuild.log | head -80
              tail -n 120 xcodebuild.log
              exit 1
            }
          grep -E "\*\* BUILD" xcodebuild.log || true
          APP=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -name "*.app" -type d | head -1)
          echo "APP=$APP"
          test -n "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP/Info.plist" || true
          ls -la "$APP" | head -40
          mkdir -p "$RUNNER_TEMP/out"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/out/vela-${{ matrix.label }}.zip"
          git log -1 --format='%H %s' > "$RUNNER_TEMP/out/sha-${{ matrix.label }}.txt"
          cat "$RUNNER_TEMP/out/sha-${{ matrix.label }}.txt"
          ls -la "$RUNNER_TEMP/out"

      - name: Upload the .app
        uses: actions/upload-artifact@v4
        with:
          name: vela-app-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/out/vela-${{ matrix.label }}.zip
            ${{ runner.temp }}/out/sha-${{ matrix.label }}.txt
          retention-days: 7
          if-no-files-found: error

      - name: Upload the build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ matrix.label }}
          path: src/xcodebuild.log
          retention-days: 7

  fresh-install:
    name: fresh install ${{ matrix.device }}
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: macos-26
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        device: [promax, small]
    steps:
      - name: Checkout the test
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the 1.1 .app (this run)
        if: needs.plan.outputs.reuse == ''
        uses: actions/download-artifact@v4
        with:
          name: vela-app-v11
          path: apps/vela-app-v11

      - name: Download the 1.1 .app (reused run)
        if: needs.plan.outputs.reuse != ''
        uses: actions/download-artifact@v4
        with:
          name: vela-app-v11
          path: apps/vela-app-v11
          run-id: ${{ needs.plan.outputs.reuse }}
          github-token: ${{ github.token }}

      - name: Fresh install, App Review path (fully traced)
        id: run
        env:
          DEVICE: ${{ matrix.device }}
          REUSED_FROM: ${{ needs.plan.outputs.reuse }}
        run: |
          mkdir -p shots shots/src
          exec > >(tee shots/debug.log) 2>&1
          set -x
          xcodebuild -version
          echo "builds from run: ${REUSED_FROM:-$GITHUB_RUN_ID}"
          cat apps/vela-app-v11/sha-v11.txt 2>/dev/null | tee shots/BUILT-FROM.txt || echo "sha unknown (reused older artifact)" | tee shots/BUILT-FROM.txt
          mkdir -p app11
          ditto -x -k apps/vela-app-v11/vela-v11.zip app11
          APP11=$(find app11 -maxdepth 1 -name "*.app" -type d | head -1)
          test -n "$APP11"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP11/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP11/Info.plist"
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP11/Info.plist")
          echo "EXE=$EXE"

          echo "== simulator: $DEVICE =="
          xcrun simctl list runtimes available
          IFS=$'\t' read -r RUNTIME TYPE_ID TYPE_NAME SIZE < <(python3 e2e/pick-device.py "$DEVICE")
          echo "RUNTIME=$RUNTIME TYPE=$TYPE_ID ($TYPE_NAME, $SIZE pt)"
          UDID=$(xcrun simctl create "Vela fresh $DEVICE" "$TYPE_ID" "$RUNTIME")
          test -n "$UDID"
          printf 'device %s\nname %s\ntype %s\nruntime %s\npoints %s\nudid %s\n' "$DEVICE" "$TYPE_NAME" "$TYPE_ID" "$RUNTIME" "$SIZE" "$UDID" | tee shots/DEVICE.txt
          # A connected hardware keyboard would hide the software one: the checks need the real keyboard.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false || true
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # Type exactly what the user would (no autocorrect), and no slide-to-type intro over the keyboard.
          for k in KeyboardAutocorrection KeyboardPrediction KeyboardCheckSpelling KeyboardAutocapitalization; do
            xcrun simctl spawn "$UDID" defaults write com.apple.Preferences "$k" -bool NO || true
          done
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool YES || true
          xcrun simctl status_bar "$UDID" override --time "21:04" \
            --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 \
            --batteryState charged --batteryLevel 100 || true
          touch /tmp/e2e-start
          START=$(date '+%Y-%m-%d %H:%M:%S')

          echo "== install 1.1 only (a fresh install) =="
          xcrun simctl install "$UDID" "$APP11"
          xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data

          echo "== appium =="
          npm install -g appium@latest
          appium --version
          appium driver install xcuitest
          appium driver list --installed
          (cd e2e && npm install --no-audit --no-fund)
          appium --port 4723 --base-path / --log-timestamp --log-no-colors > shots/appium.log 2>&1 &
          for i in $(seq 1 30); do curl -s http://127.0.0.1:4723/status && break; sleep 2; done

          FAILED=""
          (cd e2e && UDID="$UDID" DEVICE="$DEVICE" SHOTS_DIR="$GITHUB_WORKSPACE/shots" node fresh-install.mjs) || FAILED="$FAILED walk"
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          sleep 2

          echo "== device logs, crash reports, JS errors =="
          xcrun simctl spawn "$UDID" log show --start "$START" --style compact --predicate "process == \"$EXE\" AND NOT (subsystem BEGINSWITH \"com.apple.dt.xctest\")" > shots/vela-log-show.txt 2>&1 || true
          wc -l shots/vela-log-show.txt || true
          grep -iE "fault|error|exception|crash|terminat|com.facebook.react|\(React\)" shots/vela-log-show.txt | grep -viE "^Filtering|UIKit:BackgroundTask|CHHapticPattern|UIKBFeedbackGenerator" | head -600 > shots/vela-log-interesting.txt || true
          mkdir -p shots/crash
          find ~/Library/Logs/DiagnosticReports -newer /tmp/e2e-start -type f 2>/dev/null | tee shots/crash-reports.txt || true
          find ~/Library/Logs/DiagnosticReports -newer /tmp/e2e-start -type f -exec cp {} shots/crash/ \; 2>/dev/null || true
          grep -l "\"$EXE\"\|app.vela.manifest" shots/crash/* 2>/dev/null | tee shots/crash-reports-vela.txt || true
          node e2e/logcheck.mjs "fresh-$DEVICE" shots/vela-log-show.txt shots/crash-reports-vela.txt || FAILED="$FAILED logs"

          echo "== first-tap probe: does 'Begin' take the first tap after a fresh install? (evidence, never a gate) =="
          (cd e2e && UDID="$UDID" APP="$GITHUB_WORKSPACE/$APP11" DEVICE="$DEVICE" SHOTS_DIR="$GITHUB_WORKSPACE/shots/probe" TRIALS=6 node first-tap-probe.mjs) || true
          [ -f shots/appium.log ] && gzip -9 shots/appium.log || true
          ls -la shots
          echo "== RESULTS =="
          grep -hE "RESULT:|SUMMARY|FAILED " shots/debug.log || true
          echo "failed:${FAILED:- none}"
          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"
          [ -z "$FAILED" ]

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-fresh-${{ matrix.device }}
          path: shots
          retention-days: 14

  update-test:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout the test
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the .apps (this run)
        if: needs.plan.outputs.reuse == ''
        uses: actions/download-artifact@v4
        with:
          pattern: vela-app-*
          path: apps

      - name: Download the .apps (reused run)
        if: needs.plan.outputs.reuse != ''
        uses: actions/download-artifact@v4
        with:
          pattern: vela-app-*
          path: apps
          run-id: ${{ needs.plan.outputs.reuse }}
          github-token: ${{ github.token }}

      - name: Update test (fully traced)
        id: run
        env:
          REUSED_FROM: ${{ needs.plan.outputs.reuse }}
        run: |
          mkdir -p shots shots/state shots/src
          exec > >(tee shots/debug.log) 2>&1
          set -x
          xcodebuild -version
          echo "builds from run: ${REUSED_FROM:-$GITHUB_RUN_ID}"
          cat apps/vela-app-v*/sha-*.txt 2>/dev/null | tee shots/BUILT-FROM.txt || true
          find apps -maxdepth 3 | head -20
          mkdir -p app101 app11
          ditto -x -k apps/vela-app-v101/vela-v101.zip app101
          ditto -x -k apps/vela-app-v11/vela-v11.zip app11
          APP101=$(find app101 -maxdepth 1 -name "*.app" -type d | head -1)
          APP11=$(find app11 -maxdepth 1 -name "*.app" -type d | head -1)
          test -n "$APP101" && test -n "$APP11"
          for A in "$APP101" "$APP11"; do
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$A/Info.plist"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$A/Info.plist"
          done
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP11/Info.plist")
          echo "EXE=$EXE"

          echo "== simulator =="
          xcrun simctl list runtimes available
          IFS=$'\t' read -r RUNTIME TYPE_ID TYPE_NAME SIZE < <(python3 e2e/pick-device.py promax)
          # A 6.9" @3x phone, so the share PNG is captured at @3x like most phones.
          UDID=$(xcrun simctl create "Vela update test" "$TYPE_ID" "$RUNTIME")
          echo "UDID=$UDID RUNTIME=$RUNTIME TYPE=$TYPE_ID ($TYPE_NAME, $SIZE pt)"
          test -n "$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false || true
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # Type exactly what the user would (no autocorrect), and no slide-to-type intro over the keyboard.
          for k in KeyboardAutocorrection KeyboardPrediction KeyboardCheckSpelling KeyboardAutocapitalization; do
            xcrun simctl spawn "$UDID" defaults write com.apple.Preferences "$k" -bool NO || true
          done
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool YES || true
          xcrun simctl status_bar "$UDID" override --time "21:04" \
            --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 \
            --batteryState charged --batteryLevel 100 || true
          touch /tmp/e2e-start
          START=$(date '+%Y-%m-%d %H:%M:%S')
          # The Files app creates the 'On My iPhone' storage the import step puts a backup into.
          xcrun simctl launch "$UDID" com.apple.DocumentsApp || true
          sleep 8
          xcrun simctl terminate "$UDID" com.apple.DocumentsApp || true

          echo "== appium =="
          npm install -g appium@latest
          appium --version
          appium driver install xcuitest
          appium driver list --installed
          (cd e2e && npm install --no-audit --no-fund && npm install --no-save --no-audit --no-fund pngjs@7.0.0)
          appium --port 4723 --base-path / --log-timestamp --log-no-colors > shots/appium.log 2>&1 &
          for i in $(seq 1 30); do curl -s http://127.0.0.1:4723/status && break; sleep 2; done

          export UDID BUNDLE_ID SHOTS_DIR="$PWD/shots" STATE_DIR="$PWD/shots/state"
          FAILED=""
          phase() { (cd e2e && node update-test.mjs "$@") || FAILED="$FAILED $1"; }

          echo "== A: Vela 1.0.1, a long-time user =="
          xcrun simctl install "$UDID" "$APP101"
          xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data | tee shots/state/container-101.txt
          xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" app
          phase drive101
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          sleep 2

          echo "== seed: what a lifetime owner's 1.0.1 device holds =="
          phase seed
          phase verify101
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          sleep 2
          phase reseed

          echo "== UPDATE: install 1.1 over 1.0.1 =="
          xcrun simctl install "$UDID" "$APP11"
          xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data | tee shots/state/container-11.txt
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" app)/Info.plist"
          phase drive11
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          sleep 2
          phase dump

          echo "== device logs, crash reports, JS errors =="
          # The app's own lines (XCTest's accessibility chatter left out), then the ones worth reading.
          xcrun simctl spawn "$UDID" log show --start "$START" --style compact --predicate "process == \"$EXE\" AND NOT (subsystem BEGINSWITH \"com.apple.dt.xctest\")" > shots/vela-log-show.txt 2>&1 || true
          wc -l shots/vela-log-show.txt || true
          grep -iE "fault|error|exception|crash|terminat|storekit|AsyncStorage|AVSpeech|AVAudioSession|com.facebook.react|\(React\)" shots/vela-log-show.txt | grep -viE "^Filtering|UIKit:BackgroundTask|CHHapticPattern|UIKBFeedbackGenerator" | head -600 > shots/vela-log-interesting.txt || true
          mkdir -p shots/crash
          find ~/Library/Logs/DiagnosticReports -newer /tmp/e2e-start -type f 2>/dev/null | tee shots/crash-reports.txt || true
          find ~/Library/Logs/DiagnosticReports -newer /tmp/e2e-start -type f -exec cp {} shots/crash/ \; 2>/dev/null || true
          grep -l "\"$EXE\"\|app.vela.manifest" shots/crash/* 2>/dev/null | tee shots/crash-reports-vela.txt || true
          node e2e/logcheck.mjs update shots/vela-log-show.txt shots/crash-reports-vela.txt || FAILED="$FAILED logs"
          [ -f shots/appium.log ] && gzip -9 shots/appium.log || true
          ls -la shots
          echo "== RESULTS =="
          grep -hE "RESULT:|SUMMARY" shots/debug.log || true
          echo "failed phases:${FAILED:- none}"
          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"
          [ -z "$FAILED" ]

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-update
          path: shots
          retention-days: 14

  publish:
    needs: [plan, build, fresh-install, update-test]
    # Not for a cancelled run (a newer push replaced it): its empty results would overwrite the last real ones.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download every job's results
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: /tmp/artifacts

      - name: Publish results to ios-update-results
        run: |
          set -x
          rm -rf /tmp/results && mkdir -p /tmp/results
          for d in /tmp/artifacts/results-*; do
            [ -d "$d" ] || continue
            name=$(basename "$d"); name=${name#results-}
            mkdir -p "/tmp/results/$name"
            cp -R "$d/." "/tmp/results/$name/"
          done
          {
            printf 'iOS simulator tests run %s\nrun %s\nhead %s\nbuilds from run %s\n' "$(date -u)" "$GITHUB_RUN_ID" "$GITHUB_SHA" "${{ needs.plan.outputs.reuse || github.run_id }}"
            printf 'jobs: build=%s fresh-install=%s update-test=%s\n' "${{ needs.build.result }}" "${{ needs.fresh-install.result }}" "${{ needs.update-test.result }}"
            for f in /tmp/results/*/BUILT-FROM.txt; do [ -f "$f" ] && printf '%s: %s\n' "$(basename "$(dirname "$f")")" "$(head -2 "$f" | tr '\n' ' ')"; done
            echo "== checks =="
            grep -hE "RESULT: (FAIL|NOT-TESTABLE)" /tmp/results/*/debug.log 2>/dev/null | sed -E 's/^.*\] \+[0-9.]+s //' | head -80 || true
          } > /tmp/results/RUN.txt
          cat /tmp/results/RUN.txt
          git config user.email "ci@vela"; git config user.name "ios-update-test"
          # Orphan branch, then wipe every working file so only the results are committed.
          git checkout --orphan ios-update-results
          git rm -rf --cached . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true
          cp -R /tmp/results/. .
          git add -A
          git commit -m "iOS simulator test results ${GITHUB_RUN_ID} [skip ci]" || echo "nothing to commit"
          git push -f origin ios-update-results
