<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="2796">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0B0A18" />
      <stop offset=".55" stop-color="#171331" />
      <stop offset="1" stop-color="#3B2542" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#E9B44C" />
      <stop offset="1" stop-color="#B784F7" />
    </linearGradient>
    <clipPath id="screen">
      <rect x="145" y="720" width="1000" height="1810" rx="76" />
    </clipPath>
    <filter id="shadow">
      <feDropShadow
        dy="38"
        stdDeviation="44"
        flood-color="#000"
        flood-opacity=".55"
      />
    </filter>
  </defs>
  <rect width="1290" height="2796" fill="url(#bg)" />
  <circle cx="1100" cy="250" r="280" fill="#B784F7" opacity=".10" />
  <circle cx="80" cy="1450" r="350" fill="#E9B44C" opacity=".07" />
  <text
    x="100"
    y="120"
    font-family="Arial"
    font-size="28"
    font-weight="800"
    letter-spacing="6"
    fill="#E9B44C"
  >
    VELA · FUTURE MEMORY STUDIO
  </text>
  <text
    x="100"
    y="268"
    font-family="Georgia"
    font-size="92"
    font-weight="700"
    fill="#F7F2FF"
  >
    <tspan x="100">Imagine it.</tspan>
    <tspan x="100" dy="108">Then bridge it to today.</tspan>
  </text>
  <text x="104" y="560" font-family="Arial" font-size="34" fill="#CBC5DA">
    A personal future chapter becomes one observable action.
  </text>
  <g filter="url(#shadow)">
    <rect
      x="122"
      y="695"
      width="1046"
      height="1860"
      rx="96"
      fill="#070611"
      stroke="url(#glow)"
      stroke-width="4"
    />
    <g clip-path="url(#screen)">
      <image
        href="02-story-bridge.jpg"
        x="145"
        y="720"
        width="1000"
        height="2165"
        preserveAspectRatio="xMidYMin slice"
      />
    </g>
  </g>
  <rect x="100" y="2630" width="620" height="70" rx="35" fill="#E9B44C" />
  <text
    x="140"
    y="2676"
    font-family="Arial"
    font-size="22"
    font-weight="800"
    fill="#17101D"
  >
    PERSONALISED · PRIVATE · OFFLINE
  </text>
</svg>
